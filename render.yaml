# Render blueprint — BloomCast v2 (fully free tier, no credit card).
#
# ONE service. The FastAPI backend serves the Next.js static export from the
# same process, so there is no separate static site to host.
#
#   1. bloomcast — FastAPI web service (free; spins down after 15 min idle)
#      serves /v1/* API + the frontend at /
#
# The nightly ML pipeline is NOT scheduled on Render (Cron Jobs are a paid
# feature). It runs on GitHub Actions cron instead — see
# .github/workflows/pipeline.yml
#
# Deploy: connect this repo to Render and use this render.yaml as a blueprint.
services:
  - type: web
    name: bloomcast
    env: python
    plan: free
    region: oregon
    # Build the Next.js static export so FastAPI can serve it from
    # src/frontend/out/ at runtime. Requires Node.js in the Python build image.
    buildCommand: npm install --prefix src/frontend --legacy-peer-deps && cd src/frontend && npm run build && cd src/backend && pip install -r requirements.txt
    startCommand: cd src/backend && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.16"
      # Seed data is committed to the repo, so the free instance needs no
      # external database and no persistent disk.
      - key: SEED_DIR
        value: ../data/seed
      - key: WATERBODY_FILE
        value: ../data/waterbodies.geojson
      - key: STREAM_FILE
        value: ../data/stream_segments.geojson
      - key: REPLAY_FILE
        value: ../data/replay_events.json
      - key: CORS_ORIGINS
        value: "*"