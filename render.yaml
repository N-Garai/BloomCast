# Render blueprint — BloomCast v2 (Docker-based single service).
#
# One container running both FastAPI and the Next.js static export. The
# Dockerfile handles Node.js + npm install + frontend build, then installs
# Python deps and starts uvicorn. The backend serves the built frontend from
# src/frontend/out/ at runtime.
#
# Deploy: connect this repo to Render and use this render.yaml as a blueprint.
# Set the service runtime to Docker in the Render dashboard if not picked up
# automatically from this file.
services:
  - type: web
    name: bloomcast
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: SEED_DIR
        value: ../data/seed
      - key: WATERBODY_FILE
        value: ../data/waterbodies.geojson
      - key: STREAM_FILE
        value: ../data/stream_segments.geojson
      - key: REPLAY_FILE
        value: ../data/replay_events.json
      - key: CORS_ORIGINS
        value: "*"
      - key: BLOOMCAST_WARMUP
        value: "1"